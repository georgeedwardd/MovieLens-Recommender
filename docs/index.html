<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Derivations</title>

  <!-- MathJax for LaTeX rendering -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script"
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      font-family: Georgia, serif;
      line-height: 1.6;
    }
    pre {
      background: #f6f6f6;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <div id="content"></div>

  <script>
    fetch("derivations.md")
      .then(res => res.text())
      .then(text => {
        document.getElementById("content").innerHTML =
          text
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\n/g, "<br>");
        MathJax.typeset();
      });
  </script>

</body>
</html>
